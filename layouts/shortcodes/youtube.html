{{- $pc := .Page.Site.Config.Privacy.YouTube -}}
{{- if not $pc.Disable -}}
{{- $ytHost := cond $pc.PrivacyEnhanced "www.youtube-nocookie.com" "www.youtube.com" -}}
{{- $id := .Get "id" | default (.Get 0) -}}
<div class="video-wrapper">
    <button type="button"
            class="video-facade"
            data-yt-id="{{ $id }}"
            data-yt-host="{{ $ytHost }}"
            aria-label="{{ T `article.playVideo` | default "Carica e riproduci il video di YouTube" }}"
    >
        <img class="video-facade__thumb" src="https://i.ytimg.com/vi/{{ $id }}/hqdefault.jpg" loading="lazy" alt="">
        <span class="video-facade__play" aria-hidden="true"></span>
    </button>
</div>
{{ end -}}
